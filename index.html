<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trang chủ quản lý nội bộ- Bộ môn Cơ khí</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

<script>
  // ============================================================
  // DANH SÁCH EMAIL ĐƯỢC PHÉP VÀO TRANG
  // ============================================================
  const ALLOWED_EMAILS = ["nghiacamduyen@gmail.com", "hosonguyencam@gmail.com"];
  // ============================================================

  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#0ea5e9",
          "background-light": "#f3f4f6",
          "background-dark": "#111827",
          "card-light": "#ffffff",
          "card-dark": "#1f2937",
          "text-light": "#1f2937",
          "text-dark": "#f9fafb",
        },
      },
    },
  };
</script>

<style>
  body { font-family: 'Roboto', sans-serif; transition: opacity 0.5s; }
  .grid-item { transition: transform 0.2s, box-shadow 0.2s; height: 160px; }
  /* Mặc định ẩn nội dung để kiểm tra quyền */
  .hidden-content { opacity: 0; pointer-events: none; }
</style>
</head>

<body class="hidden-content bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">

<div id="g_id_onload"
     data-client_id="86663553257-8o03fka7vbe35t59vsc876j1mtef814g.apps.googleusercontent.com"
     data-callback="handleCredentialResponse"
     data-auto_select="true"
     data-itp_support="true">
</div>

<header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50 py-4 border-b-4 border-blue-600">
  <div class="container mx-auto px-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="material-icons text-blue-600 text-3xl">engineering</span>
      <h1 class="text-xl font-bold text-blue-700 dark:text-blue-400 uppercase tracking-tight">Bộ Môn Cơ Khí - Long An</h1>
    </div>
    <div id="user-tag" class="text-xs font-bold text-green-600"></div>
  </div>
</header>

<main class="container mx-auto px-4 py-10 max-w-6xl">
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <a class="grid-item group flex flex-col items-center justify-center p-6 bg-card-light dark:bg-card-dark rounded-xl shadow-md border-l-4 border-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20" href="LINK_1">
      <span class="material-icons text-4xl text-blue-600 mb-3">inventory_2</span>
      <h3 class="text-lg font-bold text-blue-700 text-center uppercase">Tài sản CCDC<br/>BMCK</h3>
    </a>
    </div>
</main>

<script>
  function decodeJwtResponse(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(window.atob(base64));
  }

  function handleCredentialResponse(response) {
    const responsePayload = decodeJwtResponse(response.credential);
    const email = responsePayload.email.toLowerCase();

    if (ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(email)) {
      // NẾU TRÙNG GMAIL: Hiện trang web ngay lập tức
      document.body.classList.remove('hidden-content');
      document.getElementById('user-tag').innerText = "Đã xác thực: " + email;
    } else {
      // NẾU KHÔNG TRÙNG: Báo lỗi và không cho xem trang
      alert("LỖI TRUY CẬP: Tài khoản " + email + " không có quyền vào hệ thống này.");
      document.body.innerHTML = "<div style='text-align:center; margin-top:100px; color:red; font-family:sans-serif;'><h1>403 - TỪ CHỐI TRUY CẬP</h1><p>Vui lòng đăng nhập đúng Gmail được cấp quyền trên trình duyệt.</p></div>";
      document.body.classList.remove('hidden-content');
    }
  }

  // Nếu sau 3 giây không nhận diện được tài khoản nào (do chưa đăng nhập trình duyệt)
  setTimeout(() => {
    if (document.body.classList.contains('hidden-content')) {
        alert("Vui lòng đăng nhập Gmail trên trình duyệt PC/Điện thoại trước khi truy cập.");
    }
  }, 3500);
</script>

</body>
</html>
