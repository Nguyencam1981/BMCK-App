<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trang chủ quản lý nội bộ- Bộ môn Cơ khí</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

<script>
  // ============================================================
  // DANH SÁCH EMAIL ĐƯỢC PHÉP TRUY CẬP (Chỉnh sửa tại đây)
  // ============================================================
  const ALLOWED_EMAILS = [
    "nghiacamduyen@gmail.com",
    "admin@gmail.com"
  ];
  // ============================================================

  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#0ea5e9",
          "background-light": "#f3f4f6",
          "background-dark": "#111827",
          "card-light": "#ffffff",
          "card-dark": "#1f2937",
          "text-light": "#1f2937",
          "text-dark": "#f9fafb",
        },
      },
    },
  };
</script>

<style>
  body { font-family: 'Roboto', sans-serif; }
  #main-wrapper { display: none; } /* Mặc định ẩn nội dung */
  .grid-item { transition: transform 0.2s, box-shadow 0.2s; height: 160px; }
  .grid-item:hover { transform: translateY(-5px); }
  
  /* Màn hình khóa khi chưa đăng nhập */
  #auth-overlay {
    position: fixed; inset: 0; background: #f3f4f6;
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
  }
  .dark #auth-overlay { background: #111827; }
</style>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">

<div id="auth-overlay">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-2xl text-center max-w-sm w-full mx-4 border border-gray-200 dark:border-gray-700">
        <span class="material-icons text-6xl text-blue-600 mb-4">account_circle</span>
        <h2 class="text-xl font-bold mb-2">Yêu cầu xác thực</h2>
        <p class="text-sm text-gray-500 mb-6">Bạn cần đăng nhập Gmail để truy cập nội dung này.</p>
        
        <div id="g_id_onload"
             data-client_id="86663553257-8o03fka7vbe35t59vsc876j1mtef814g.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_select="true"
             data-itp_support="true">
        </div>
        <div class="g_id_signin flex justify-center" data-type="standard" data-shape="pill"></div>
        
        <p id="error-msg" class="mt-4 text-red-500 text-sm font-bold hidden"></p>
    </div>
</div>

<div id="main-wrapper">
    <header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50 py-4 border-b-4 border-blue-600">
      <div class="container mx-auto px-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <span class="material-icons text-blue-600 text-3xl">engineering</span>
          <h1 class="text-xl font-bold text-blue-700 dark:text-blue-400 uppercase tracking-tight">Bộ Môn Cơ Khí - Long An</h1>
        </div>
        <div id="user-tag" class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded"></div>
      </div>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-6xl">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <a class="grid-item group flex flex-col items-center justify-center p-6 bg-card-light dark:bg-card-dark rounded-xl shadow-md border-l-4 border-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20" href="#">
          <span class="material-icons text-4xl text-blue-600 mb-3">inventory_2</span>
          <h3 class="text-lg font-bold text-blue-700 text-center uppercase">Tài sản CCDC<br/>BMCK</h3>
        </a>
        </div>
    </main>
</div>

<script>
  // Giải mã Token của Google
  function decodeJwtResponse(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(window.atob(base64));
  }

  // Xử lý sau khi người dùng chọn tài khoản
  function handleCredentialResponse(response) {
    const responsePayload = decodeJwtResponse(response.credential);
    const email = responsePayload.email.toLowerCase();

    if (ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(email)) {
      // Thành công -> Mở trang
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('main-wrapper').style.display = 'block';
      document.getElementById('user-tag').innerText = "Chào: " + email;
    } else {
      // Thất bại -> Báo lỗi
      const errorEl = document.getElementById('error-msg');
      errorEl.innerText = "Tài khoản " + email + " không có quyền!";
      errorEl.classList.remove('hidden');
    }
  }

  // Khắc phục lỗi khi chạy file cục bộ
  window.onload = function() {
    if (window.location.protocol === 'file:') {
        alert("Lưu ý: Tính năng đăng nhập Google không hoạt động khi mở file trực tiếp. Hãy dùng link GitHub Pages của bạn.");
    }
  }
</script>

</body>
</html>
