<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trang chủ quản lý nội bộ- Bộ môn Cơ khí</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

<script>
  // ============================================================
  // DANH SÁCH EMAIL ĐƯỢC PHÉP VÀO TRANG (Chỉnh sửa tại đây)
  // ============================================================
  const ALLOWED_EMAILS = [
    "nghiacamduyen@gmail.com",
    "hosonguyencam@gmail.com"
    "trituenhantaoai1918m@gmail.com"
  ];
  // ============================================================

  tailwind.config = {
    darkMode: "class",
    theme: { extend: { colors: { primary: "#0ea5e9", "background-light": "#f3f4f6", "background-dark": "#111827", "card-light": "#ffffff", "card-dark": "#1f2937", "text-light": "#1f2937", "text-dark": "#f9fafb" } } }
  };
</script>

<style>
  body { font-family: 'Roboto', sans-serif; }
  .grid-item { transition: transform 0.2s, box-shadow 0.2s; height: 160px; }
  /* Ẩn nội dung khi chưa xác nhận xong */
  #main-content { display: none; }
  #loading-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: white; z-index: 1000; }
</style>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">

<div id="loading-screen">
    <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-gray-600 font-bold">Đang kiểm tra quyền truy cập...</p>
        <div id="g_id_onload"
             data-client_id="86663553257-8o03fka7vbe35t59vsc876j1mtef814g.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_select="true"
             data-itp_support="true">
        </div>
        <div class="g_id_signin mt-4" data-type="standard"></div>
    </div>
</div>

<div id="main-content">
    <header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50 py-4 border-b-4 border-blue-600">
      <div class="container mx-auto px-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <span class="material-icons text-blue-600 text-3xl">engineering</span>
          <h1 class="text-xl font-bold text-blue-700 dark:text-blue-400 uppercase tracking-tight">Bộ Môn Cơ Khí - Long An</h1>
        </div>
        <span id="user-display" class="text-xs font-bold text-green-600"></span>
      </div>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-6xl">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <a class="grid-item group flex flex-col items-center justify-center p-6 bg-card-light dark:bg-card-dark rounded-xl shadow-md border-l-4 border-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20" href="LINK_CỦA_BẠN">
          <span class="material-icons text-4xl text-blue-600 mb-3">inventory_2</span>
          <h3 class="text-lg font-bold text-blue-700 text-center uppercase">Tài sản CCDC<br/>BMCK</h3>
        </a>
        </div>
    </main>
</div>

<script>
  function decodeJwtResponse(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(window.atob(base64));
  }

  function handleCredentialResponse(response) {
    const responsePayload = decodeJwtResponse(response.credential);
    const email = responsePayload.email.toLowerCase();

    // KIỂM TRA QUYỀN
    if (ALLOWED_EMAILS.some(e => e.toLowerCase() === email)) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('user-display').innerText = "Chào: " + email;
    } else {
      alert("Tài khoản " + email + " không có quyền truy cập!");
      window.location.reload(); // Load lại để chọn tài khoản khác
    }
  }

  // Tự động hiện bảng chọn tài khoản ngay khi vào trang
  window.onload = function () {
    google.accounts.id.prompt(); 
  };
</script>

</body>
</html>
